schema_version = "1.4"

[task]
name = "agent-harness/async-singleflight-cache"
version = "1.0.0"
description = "Repair a production-style asyncio stale-while-revalidate cache with single-flight loading and race-safe invalidation."
authors = [{ name = "Agent Harness maintainers" }]
keywords = ["python", "asyncio", "concurrency", "cache", "debugging"]

[metadata]
difficulty = "hard"
category = "software_engineering"
